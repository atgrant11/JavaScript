<!DOCTYPE html>
<html>
<head>
<title>Doorbell Challenge</title>
<style>
body { font-family: Arial;
     text-align: center; 
     padding: 50px; 
     background: #f0f8ff; }

h1 { color: #2c3e50; }

#main-text {
font-size: 2rem; 
margin: 40px; 
padding: 30px;
background: white;
 border: 4px solid #3498db; 
 border-radius: 15px;
}

button {
font-size: 1.3rem; 
padding: 15px 30px; 
margin: 15px;
background: #e74c3c; 
color: white; 
border: none; 
border-radius: 10px;
cursor: pointer;
}

button:hover { background: #c0392b; }


</style>
</head>
<body>
<h1>Ring the Doorbell</h1>
<p id="main-text"> a bunch of really valuable text..</p>
<button id="ring-button">Ring Bell</button>
<button id="greet-button">Greet Friends</button>
<button id="panic-button">Panic!</button>
<script>
// YOUR MISSION STARTS HERE
// Step 1: Write two functions that change the paragraph text
// What do you want to change on the page?

function youRang() {
// Change the text to "you rang..."
// Also show a message in the console
     const text = document.querySelector("main-text");
     text.textContent = "ding dong";
     console.log("knock knock");
}
function greetFriends() {
// Change the text to "Hello Friends!"
// Also show a message in the console
     const text = document.querySelector("#main-text");
     text.textContent = "the whole gang is all here"
     console.log("shabbat shalom my fellow goyim please send $16.9 trillion to Israel IMMEADIATELY")
}
// Step 2: Select the two buttons
const ringBtn = document.querySelector("#ring-button");
const greetBtn = document.querySelector("#greet-button");
const panicBtn = document.querySelector("#panic-button");
//how do you select the greet-button? (look on the line above for a hint!)

// Step 3: Add the event Listener
ringBtn.addEventListener("click", youRang);
greetBtn.addEventListener("click", greetFriends);
panicBtn.addEventListener("click", panic);

//Add the eventListener for the greetBtn


</script>
</body>
</html>
