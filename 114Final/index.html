<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="styles.css">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div class="container">
    <header>
        <h1>Dungeons & Dragons Mad Libs</h1>
        <h2>Story: The First Adventure<h2>
        <p>How to Play: Fill in the blanks to create a D&D adventure. The wackier the better!</p>
    </header>

    <main>
        <form id="madlibs-form" name="madlibs-form">
        <section id="madlibs-inputs">
            <div class="input-group">
                <label for="body-part">1. Part of the body:</label>
                <input type="text" id="body-part" name="body-part" required>
            </div>

            <div class="input-group">
                <label for="adj">2. Adjective:</label>
                <input type="text" id="adj" name="adj" required>
            </div>

            <div class="input-group">
                <label for="verb">3. Verb (Past Tense):</label>
                <input type="text" id="verb" name="verb" required>
            </div>

            <div class="input-group">
                <label for="noun1">4. Noun:</label>
                <input type="text" id="noun1" name="noun1" required>
            </div>

            <div class="input-group">
                <label for="job">5. Occupation:</label>
                <input type="text" id="job" name="job" required>
            </div>

            <div class="input-group">
                <label for="num">6. Number (1-10):</label>
                <input type="text" id="num" name="num" required>
            </div>

            <div class="input-group">
                <label for="animal">7. Animal (Plural):</label>
                <input type="text" id="animal" name="animal" required>
            </div>

            <div class="input-group">
                <label for="noun2">8. Noun:</label>
                <input type="text" id="noun2" name="noun2" required>
            </div>
        </section>

        <section id="madlibs-submit">
            <button type="submit" id="submit-btn">Create Adventure!</button>
        </section>

        <div id="storyOutput"></div>

        </form>
    </main>
    </div>
</body>
<script src="script.js"></script>
</html>
